<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600&family=JetBrains+Mono:wght@500;600&display=swap');
  :root{
    --bg:#15151D; --border:#33333F; --text:#F3F1EC; --text-dim:#9C9AA8;
    --coral:#FF6A4D; --mint:#6EE7B7; --amber:#FFC24B;
  }
  html,body{ margin:0; padding:0; background:transparent; overflow:hidden; }
  *{ box-sizing:border-box; }
  body{ font-family:'Plus Jakarta Sans', sans-serif; }

  #bar{
    width:340px; height:92px;
    background:rgba(21,21,29,0.94);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 12px;
    -webkit-app-region: drag;
    box-shadow:0 14px 30px rgba(0,0,0,.45);
    color:var(--text);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  #eyebrow{
    font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-dim);
    display:flex; align-items:center; gap:6px; -webkit-app-region:no-drag;
  }
  #eyebrow .dot{ width:6px;height:6px;border-radius:2px; background:var(--coral); transform:rotate(45deg); }
  #hide-btn{ margin-left:auto; background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:11px; -webkit-app-region:no-drag; }
  #hide-btn:hover{ color:var(--text); }

  #title{
    font-family:'Space Grotesk'; font-weight:600; font-size:14px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    -webkit-app-region:no-drag;
  }
  #empty-title{ color:var(--text-dim); font-size:12.5px; -webkit-app-region:no-drag; }

  #bottom-row{ display:flex; align-items:center; justify-content:space-between; -webkit-app-region:no-drag; }
  #timer{ font-family:'JetBrains Mono'; font-size:15px; font-weight:600; color:var(--mint); }
  #timer.paused{ color:var(--amber); }
  #controls{ display:flex; gap:5px; }
  .ctl{
    background:rgba(255,255,255,0.06); border:none; border-radius:7px;
    color:var(--text); font-size:12px; padding:5px 8px; cursor:pointer;
  }
  .ctl:hover{ background:rgba(255,255,255,0.13); }
  .ctl-done:hover{ color:var(--mint); }
  .ctl-blocked:hover{ color:var(--coral); }

  #start-row{ display:flex; gap:6px; align-items:center; -webkit-app-region:no-drag; position:relative; }
  #start-btn{
    background:var(--coral); border:none; color:#1a0f0c; font-weight:600;
    font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  #pick-menu{
    display:none; position:absolute; top:30px; left:0; width:300px; max-height:150px; overflow-y:auto;
    background:#fff; color:#222; border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,.4); padding:4px; z-index:5;
  }
  #pick-menu.show{ display:block; }
  .pick-item{ padding:6px 8px; font-size:12px; border-radius:5px; cursor:pointer; }
  .pick-item:hover{ background:#f0f0f0; }
  .pick-empty{ padding:8px; font-size:11.5px; color:#999; }
</style>
</head>
<body>
  <div id="bar">
    <div id="eyebrow"><span class="dot"></span><span>NOW</span><button id="hide-btn" title="Hide Now Bar">✕</button></div>

    <div id="active-view" style="display:none;">
      <div id="title"></div>
      <div id="bottom-row">
        <div id="timer">00:00</div>
        <div id="controls">
          <button class="ctl" id="ctl-pause" title="Pause / resume">⏸</button>
          <button class="ctl" id="ctl-switch" title="Switch task">⇄</button>
          <button class="ctl ctl-blocked" id="ctl-blocked" title="Mark blocked">🚧</button>
          <button class="ctl ctl-done" id="ctl-done" title="Mark done">✓</button>
        </div>
      </div>
    </div>

    <div id="empty-view">
      <div id="empty-title">No active task.</div>
      <div id="start-row">
        <button id="start-btn">▸ Start a task</button>
        <div id="pick-menu"></div>
      </div>
    </div>
  </div>

<script>
  const activeView = document.getElementById('active-view');
  const emptyView = document.getElementById('empty-view');
  const titleEl = document.getElementById('title');
  const timerEl = document.getElementById('timer');
  let state = { currentSession: null };
  let tickTimer = null;

  function fmt(ms){
    const total = Math.max(0, Math.floor(ms/1000));
    const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
    const pad = n => String(n).padStart(2,'0');
    return h>0 ? h+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
  }
  function elapsedMs(session){
    if(!session) return 0;
    if(session.paused) return session.accumulatedMs;
    return session.accumulatedMs + (Date.now() - session.lastResumeAt);
  }

  function render(){
    const s = state.currentSession;
    if(!s){
      activeView.style.display='none';
      emptyView.style.display='block';
      if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }
      return;
    }
    emptyView.style.display='none';
    activeView.style.display='block';
    titleEl.textContent = s.taskTitle;
    timerEl.classList.toggle('paused', !!s.paused);
    timerEl.textContent = fmt(elapsedMs(s));
    document.getElementById('ctl-pause').textContent = s.paused ? '▶' : '⏸';
    if(!tickTimer){
      tickTimer = setInterval(()=>{ if(state.currentSession) timerEl.textContent = fmt(elapsedMs(state.currentSession)); }, 1000);
    }
  }

  window.tempoBar.onSessionUpdate((payload)=>{ state.currentSession = payload.currentSession; render(); });

  document.getElementById('ctl-pause').addEventListener('click', async ()=>{
    const s = state.currentSession;
    if(!s) return;
    state.currentSession = s.paused ? await window.tempoBar.sessionResume() : await window.tempoBar.sessionPause();
    render();
  });
  document.getElementById('ctl-done').addEventListener('click', async ()=>{
    const s = state.currentSession;
    if(!s) return;
    const tasks = (await window.tempoBar.getStore('tasks')) || [];
    const idx = tasks.findIndex(t=>t.id===s.taskId);
    if(idx>=0){ tasks[idx].status='done'; tasks[idx].done=true; tasks[idx].completedAt=new Date().toISOString(); await window.tempoBar.setStore('tasks', tasks); }
    const res = await window.tempoBar.sessionStop('done');
    state.currentSession = res.currentSession;
    render();
  });
  document.getElementById('ctl-blocked').addEventListener('click', async ()=>{
    const s = state.currentSession;
    if(!s) return;
    const tasks = (await window.tempoBar.getStore('tasks')) || [];
    const idx = tasks.findIndex(t=>t.id===s.taskId);
    if(idx>=0){ tasks[idx].status='blocked'; await window.tempoBar.setStore('tasks', tasks); }
    const res = await window.tempoBar.sessionStop('blocked');
    state.currentSession = res.currentSession;
    render();
  });
  document.getElementById('ctl-switch').addEventListener('click', async (e)=>{
    e.stopPropagation();
    await openPicker(document.getElementById('ctl-switch'));
  });
  document.getElementById('hide-btn').addEventListener('click', ()=> window.close());

  const pickMenu = document.getElementById('pick-menu');
  async function openPicker(){
    if(pickMenu.classList.contains('show')){ pickMenu.classList.remove('show'); return; }
    const tasks = (await window.tempoBar.getStore('tasks')) || [];
    const open = tasks.filter(t=>!t.done);
    pickMenu.innerHTML = '';
    if(open.length===0){
      pickMenu.innerHTML = '<div class="pick-empty">No open tasks. Add one in Tempo.</div>';
    } else {
      open.forEach(t=>{
        const row = document.createElement('div');
        row.className='pick-item'; row.textContent=t.title;
        row.addEventListener('click', async ()=>{
          const tasksNow = (await window.tempoBar.getStore('tasks')) || [];
          const idx = tasksNow.findIndex(x=>x.id===t.id);
          if(idx>=0){ tasksNow[idx].status='in-progress'; await window.tempoBar.setStore('tasks', tasksNow); }
          state.currentSession = await window.tempoBar.sessionStart(t.id, t.title);
          render();
          pickMenu.classList.remove('show');
        });
        pickMenu.appendChild(row);
      });
    }
    pickMenu.classList.add('show');
  }
  document.getElementById('start-btn').addEventListener('click', openPicker);
  document.addEventListener('click', (e)=>{
    if(!document.getElementById('start-row').contains(e.target) && e.target.id!=='ctl-switch') pickMenu.classList.remove('show');
  });

  (async function init(){
    const res = await window.tempoBar.sessionGetState();
    state.currentSession = res.currentSession;
    render();
  })();
</script>
</body>
</html>
